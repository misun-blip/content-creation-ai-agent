name: CI — 后端测试

on:
  push:
    branches: [ main, develop, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop, master ]
    paths:
      - 'backend/**'

jobs:
  test:
    name: pytest 自动化测试
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 配置 Python 环境
      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      # 3. 安装依赖
      - name: 安装生产依赖
        run: pip install -r requirements.txt

      - name: 安装开发/测试依赖
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # 4. 设置测试环境变量（SQLite 内存库，无需真实 MySQL/Redis）
      - name: 设置测试环境变量
        run: |
          echo "DATABASE_URL=sqlite:///./ci_test.db" >> $GITHUB_ENV
          echo "SECRET_KEY=ci-test-secret-key-github-actions" >> $GITHUB_ENV
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=60" >> $GITHUB_ENV
          echo "DEBUG=0" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=test-api-key" >> $GITHUB_ENV
          echo "OPENAI_API_BASE=https://api.openai.com/v1" >> $GITHUB_ENV
          echo "AI_API_KEY=test-ai-api-key" >> $GITHUB_ENV
          echo "AI_API_BASE=https://api.chatanywhere.tech/v1" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV

      # 5. 运行测试
      - name: 运行 pytest
        run: |
          pytest \
            --tb=short \
            -q \
            --no-header \
            -p no:warnings

      # 6. 生成 JSON 测试报告（可选，用于后续上传）
      - name: 生成 JSON 测试报告
        if: always()
        run: |
          pip install pytest-json-report --quiet
          pytest \
            --json-report \
            --json-report-file=../test-report.json \
            --tb=short \
            -q \
            --no-header \
            -p no:warnings || true

      # 7. 上传测试报告为 Artifact
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: test-report.json
          retention-days: 14
