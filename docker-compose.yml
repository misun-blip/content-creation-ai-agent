services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: content_ai_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: content_ai_agent
      MYSQL_USER: content_ai
      MYSQL_PASSWORD: content_ai_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - content_ai_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:6.0
    container_name: content_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - content_ai_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: content_ai_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://content_ai:content_ai_password@mysql:3306/content_ai_agent
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-in-production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - content_ai_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: content_ai_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - content_ai_network
    command: npm run dev

  # Nginx 反向代理
  nginx:
    image: nginx:1.25-alpine
    container_name: content_ai_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - content_ai_network

volumes:
  mysql_data:
  redis_data:


networks:
  content_ai_network:
    driver: bridge
