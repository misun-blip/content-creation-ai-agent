[pytest]
# pytest配置文件

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# 输出选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 标记定义
markers =
    slow: 标记运行较慢的测试
    integration: 标记集成测试
    unit: 标记单元测试
    auth: 认证模块测试
    materials: 素材库模块测试
    ai: AI生成模块测试
    adapter: 平台适配模块测试
    records: 创作记录模块测试
    statistics: 统计分析模块测试
    tags: 标签模块测试
    uploads: 上传服务测试
    dashboard: 仪表盘聚合测试
    security: 安全测试
    performance: 性能测试

# 最小Python版本
minversion = 7.0

# 异步测试模式
asyncio_mode = auto

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
